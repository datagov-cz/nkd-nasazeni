apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkd-catalog-deployment
  namespace: nkd
  labels:
    app.kubernetes.io/name: catalog
spec:
  template:
    spec:
      containers:
        - name: nkd-catalog
          env:
            - name: CONCEPT_SPARQL
              value: "https://test.dia.gov.cz/slovníky/sparql"
            - name: CONCEPT_VIEWER_URL_TEMPLATE
              value: "https://slovník-test.dia.gov.cz/popisujeme/concept/nkd?iri={}"
            - name: GOV_DESIGN_SYSTEM_BASE
              value: "/assets/design-system/4.7/"
            - name: LABEL_CACHE_RELOAD_CRON
              value: "*/5 * * * *"
            - name: SITE_ORIGIN
              value: "https://pod-test.dia.gov.cz/"
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
